<style>
:root{--bg:#050B14;--blue:#003B73;--plasma:#00D4FF;--bronze:#3B2F0F;--gold:#FFD700;--rgold:#80C6A0;--red:#3B0A0A;--wine:#3B0A0A;--text:#edf7ff;--muted:#89a5bb;--panel:#091522;--line:rgba(0,212,255,.17);--shadow:0 20px 60px rgba(0,0,0,.35);--radius:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#082443 0,#050B14 45%);color:var(--text);font-family:Canela,Georgia,serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(5,11,20,.88);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;font-family:Playfair Display,serif;font-weight:700;letter-spacing:.04em}.logo{width:38px;height:38px;border:1px solid rgba(0,212,255,.55);border-radius:12px;display:grid;place-items:center;color:var(--plasma);background:linear-gradient(135deg,#0b2c49,#05111d);box-shadow:0 0 28px rgba(0,212,255,.13)}.hamb{position:absolute;left:10px;top:78px;width:42px;height:42px;border:1px solid var(--line);background:#08131f;color:var(--plasma);border-radius:13px;z-index:19;font-size:22px}.brand{margin-left:52px}.profile{display:flex;align-items:center;gap:9px;font-family:system-ui,sans-serif;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,215,0,.35);background:#162536}.profile button{border:0;background:none;color:var(--muted);font-size:12px}.syncstatus{font:11px system-ui;color:var(--gold);display:none}.syncstatus.show{display:inline-flex;align-items:center;gap:5px}.tokenusage{font:10px system-ui;color:#aebfca;margin:4px 0 0 2px;display:flex;align-items:center;gap:7px}.tokenusage .tbar{height:3px;flex:1;max-width:110px;background:#1b1710;border-radius:99px;overflow:hidden;border:1px solid rgba(255,215,0,.12)}.tokenusage .tbar i{display:block;height:100%;background:linear-gradient(90deg,#3B2F0F,#FFD700)}.comparetable{width:100%;border-collapse:collapse;font:11px system-ui;color:#b7c9d5}.comparetable th,.comparetable td{text-align:left;padding:7px;border-bottom:1px solid rgba(255,255,255,.06)}.pdfmodal{width:min(1100px,100%);height:90vh}.pdfbody{padding:0;height:calc(90vh - 62px)}.pdfbody iframe{display:block;width:100%;height:80vh;border:0;background:#111}.main{flex:1;width:min(1180px,100%);margin:auto;padding:28px 16px 115px}.welcome{min-height:280px;display:grid;place-items:center;text-align:center;padding:40px 10px}.welcome h1{font-family:Playfair Display,serif;font-size:clamp(30px,7vw,58px);font-weight:600;margin:0 0 10px;background:linear-gradient(100deg,#fff,var(--plasma));-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);font-size:15px;margin:0}.dashboard{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{background:linear-gradient(180deg,rgba(9,21,34,.95),rgba(5,13,23,.95));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-title{font-weight:700}.panel-body{padding:18px}.mode-card{padding:18px;border-radius:16px;border:1px solid rgba(255,215,0,.2);background:linear-gradient(135deg,rgba(59,47,15,.28),rgba(0,59,115,.12));min-height:150px}.mode-card h3{font-family:Playfair Display,serif;color:var(--gold);margin:0 0 8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid rgba(0,212,255,.18);background:#071522;color:#9fc2d8;padding:8px 11px;border-radius:999px;font-size:12px}.progress{height:8px;border-radius:99px;background:#1b1710;overflow:hidden;border:1px solid rgba(255,215,0,.15)}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B2F0F,#8a6b12,#FFD700);box-shadow:0 0 15px rgba(255,215,0,.25)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid rgba(128,198,160,.2);border-radius:14px;background:#07111c}.stat b{display:block;font-size:20px;color:var(--rgold)}.stat span{font-size:11px;color:var(--muted)}
.sidebar{position:fixed;inset:0 auto 0 0;width:min(340px,92vw);background:#06101b;border-right:1px solid var(--line);transform:translateX(-105%);transition:.28s ease;z-index:50;box-shadow:30px 0 80px rgba(0,0,0,.5);overflow:auto}.sidebar.open{transform:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}.scrim.open{display:block}.side-head{padding:22px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.side-head h2{font-family:Playfair Display;margin:0;color:var(--plasma)}.close{background:none;border:0;color:#7893a8;font-size:24px}.nav{padding:12px}.navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid transparent;background:transparent;color:#b8d0df;border-radius:13px;text-align:left}.navbtn:hover,.navbtn.active{background:#0a1a2a;border-color:rgba(0,212,255,.14);color:#fff}.navbtn strong{font-size:13px}.side-note{margin:12px;padding:13px;border:1px solid rgba(255,215,0,.18);background:rgba(59,47,15,.18);border-radius:14px;color:#a99667;font-size:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(5,11,20,.96);border-top:1px solid var(--line);backdrop-filter:blur(20px);padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:190px 1fr 48px;gap:8px;align-items:center}.composer{display:flex;gap:8px;align-items:center}.composer textarea{flex:1;min-height:42px;max-height:100px;resize:none;background:#081521;color:#fff;border:1px solid rgba(0,212,255,.18);border-radius:15px;padding:11px 13px;outline:none}.send{width:44px;height:44px;border:1px solid rgba(0,212,255,.4);border-radius:14px;background:#062d45;color:var(--plasma)}.bottom select,.tokenline{height:42px;border:1px solid rgba(255,215,0,.22);border-radius:13px;background:#0a1118;color:#e7eef2;padding:0 10px;min-width:0}.tokenline{display:flex;align-items:center;justify-content:center;gap:8px;font:11px system-ui;color:#aebfca}.settings{height:44px;border:1px solid rgba(255,215,0,.2);border-radius:14px;background:#171208;color:var(--gold);font-size:18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;place-items:center;z-index:80;padding:16px}.overlay.open{display:grid}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#07131f;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 100px rgba(0,0,0,.65)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.field{margin-bottom:14px}.field label{display:block;color:#9db7c9;font:12px system-ui;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#050e17;color:#fff;border:1px solid rgba(0,212,255,.18);border-radius:12px;padding:11px;outline:none}.primary{border:1px solid rgba(0,212,255,.4);background:#06314a;color:#eaffff;padding:11px 15px;border-radius:12px}.goldbtn{border:1px solid rgba(255,215,0,.4);background:#241c08;color:#ffe16b;padding:11px 15px;border-radius:12px}.muted{color:var(--muted);font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.content{padding:16px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.tab{white-space:nowrap;padding:9px 12px;border-radius:11px;border:1px solid rgba(0,212,255,.13);background:#07131e;color:#91aaba}.tab.active{color:#fff;background:#0b2a42;border-color:rgba(0,212,255,.35)}.section-title{font-family:Playfair Display,serif;color:var(--plasma);font-size:25px;margin:5px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid rgba(255,255,255,.07);background:#07121d;border-radius:16px;padding:15px}.card h4{margin:0 0 6px;font-family:Playfair Display}.card p{font-size:12px;color:#8ea7b7;line-height:1.5}.lesson h4{color:var(--gold)}.problem h4{color:#ff8c8c}.certificate{background:linear-gradient(135deg,#3B0A0A,#180406);border:1px solid rgba(255,215,0,.25);padding:26px;text-align:center;border-radius:18px}.certificate h2{font-family:Playfair Display;color:var(--gold);font-size:30px}.chat{display:flex;flex-direction:column;gap:12px;max-height:50vh;overflow:auto;padding-right:3px}.bubble{max-width:88%;padding:13px 15px;border-radius:16px;line-height:1.55;font-size:14px;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#06324b;border:1px solid rgba(0,212,255,.25);font-family:Golden,serif}.bubble.ai{align-self:flex-start;background:#121006;border:1px solid rgba(255,215,0,.18);font-family:Playfair Display,serif}.bubble.mode-task{background:#160707;border-color:rgba(255,90,90,.2);font-family:Questa,serif}.empty{padding:28px;text-align:center;color:#6d8798;border:1px dashed rgba(255,255,255,.08);border-radius:16px}.search{width:100%;margin-bottom:12px}.list{display:flex;flex-direction:column;gap:8px}.listrow{padding:12px;border:1px solid rgba(255,255,255,.06);border-radius:13px;background:#07121d;display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:11px;color:#7994a6}.toast{position:fixed;right:14px;top:82px;z-index:100;background:#071a27;border:1px solid rgba(0,212,255,.25);padding:12px 14px;border-radius:12px;display:none;max-width:320px;font:12px system-ui;box-shadow:var(--shadow)}.toast.show{display:block}.loading{display:inline-flex;gap:4px}.loading i{width:5px;height:5px;border-radius:50%;background:var(--plasma);animation:p .8s infinite}.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.25;transform:translateY(-3px)}}
@media(max-width:800px){.dashboard{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:125px 1fr 45px}.tokenline{display:none}.bottom select{width:125px}.welcome{min-height:240px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.profile .pname{display:none}.bottom{grid-template-columns:1fr 44px}.bottom select{display:none}.main{padding-left:12px;padding-right:12px}.hamb{top:76px}.brand span{font-size:15px}}
</style>

<body>
<div id="app" class="app">
<header class="topbar"><div class="brand"><div class="logo">FX</div><span>FrameX L</span></div><div class="profile"><span id="syncStatus" class="syncstatus">● Syncing…</span><img id="avatar" class="avatar" alt="Google profile"><span id="pname" class="pname">Guest Learner</span><button id="loginTop">Sign in</button></div></header>
<button id="hamb" class="hamb" aria-label="Open sidebar">☰</button><div id="scrim" class="scrim"></div>
<aside id="sidebar" class="sidebar"><div class="side-head"><h2>FrameX L</h2><button class="close" id="closeSide">×</button></div><nav class="nav">
<button class="navbtn active" data-section="home">⌂ <strong>Home</strong></button><button class="navbtn" data-section="lessons">◈ <strong>Lessons</strong></button><button class="navbtn" data-section="learning">◉ <strong>Learning Mode</strong></button><button class="navbtn" data-section="assignments">▣ <strong>Assignments</strong></button><button class="navbtn" data-section="problems">◆ <strong>Problems</strong></button><button class="navbtn" data-section="achievement">★ <strong>Achievement</strong></button><button class="navbtn" data-section="library">▤ <strong>Library</strong></button>
</nav><div class="side-note">Build first. Understand deeply. Prompt deliberately. FrameX L tracks your learning locally and can sync your workspace to Google Drive after authorization.</div></aside>
<main id="main" class="main"></main>
<div class="bottom"><select id="modelSelect" aria-label="AI model"></select><div class="composer"><textarea id="input" placeholder="Ask, practice, or solve with a prompt…"></textarea><button id="send" class="send">➤</button></div><button id="settings" class="settings">⚙</button></div>
</div>
<div id="modal" class="overlay"><div class="modal"><div class="modal-head"><b id="modalTitle">Settings</b><button class="close" id="modalClose">×</button></div><div id="modalBody" class="modal-body"></div></div></div><div id="toast" class="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* FrameX L — single-file app. Google OAuth/Drive and NVIDIA are browser-side integrations. */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORE='framexL_state_v1';
const state=JSON.parse(localStorage.getItem(STORE)||'null')||{name:'Guest Learner',email:'',picture:'',nvKey:'',driveToken:'',driveFolderId:'',mode:'Study',section:'home',learningTab:'pdf',assignTab:'notes',problemTab:'lessons',library:[],history:[],solved:[],marks:[],achievements:[],viewedChapters:[],progress:{chapters:0,problems:0,assignments:0},tokens:{total:0,chatLeft:100},selectedModel:'meta/llama-3.3-70b-instruct',lastComparison:null};
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
/* One-time migration: remove the old embedded credential/model from previous builds. */
if(state.nvKey==='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')state.nvKey='';
if(state.selectedModel==='meta/llama-3.2-90b-vision-instruct'||state.selectedModel==='gemini-3.8-flash')state.selectedModel='meta/llama-3.3-70b-instruct';
state.viewedChapters=Array.isArray(state.viewedChapters)?state.viewedChapters:[];state.achievements=Array.isArray(state.achievements)?state.achievements:[];state.lastComparison=state.lastComparison||null;state.progress=state.progress||{chapters:0,problems:0,assignments:0};
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)};
const models=Array.from({length:124},(_,i)=>({id:'nvidia-build-'+String(i+1).padStart(3,'0'),name:`NVIDIA Build Module ${String(i+1).padStart(3,'0')}`,engine:'NVIDIA'}));
models[0]={id:'meta/llama-3.3-70b-instruct',name:'Llama 3.3 70B · Primary',engine:'NVIDIA'};
const levels=[
['Level 01 · Foundations',['What Is Prompt Engineering','ART Formula: Act · Request · Tasks','Prompt anatomy and instruction hierarchy','Context, constraints and intent','Tokens, tokenization and context windows','Prompt quality checklist']],
['Level 02 · Core Prompting',['Zero-shot prompting','Few-shot prompting','Role prompting','System vs user instructions','Output formats and schemas','Prompt iteration loops']],
['Level 03 · Reasoning',['Decomposition and sub-tasks','Chain-of-thought alternatives','Self-checking and verification','Assumption control','Examples-driven reasoning','Error analysis prompts']],
['Level 04 · Structured Outputs',['JSON prompting','Tables and structured text','Classification prompts','Extraction prompts','Transformation prompts','Reusable templates']],
['Level 05 · Learning Prompts',['Socratic tutoring','Study plans with AI','Notes and active recall','Question generation','Exam simulation','Personalized feedback']],
['Level 06 · Creative Prompting',['Story and narrative control','Image prompt foundations','Video prompt foundations','Style and tone control','Creative constraints','Iterative creative direction']],
['Level 07 · Agentic Workflows',['Prompt chaining','Tool-aware prompting','Workflow decomposition','Memory design','Context management','Automation-ready prompts']],
['Level 08 · Evaluation',['Prompt test sets','Quality rubrics','A/B prompt tests','Hallucination checks','Safety and refusal behavior','Regression testing']],
['Level 09 · Advanced Engineering',['Long-context strategy','Multi-model routing','Cost and token optimization','Prompt injection awareness','Domain-specific prompting','Production prompt architecture']],
['Level 10 · Professional Mastery',['Prompt libraries','Prompt documentation','Client-ready prompt systems','AI product prompting','Capstone: build a tutor','Capstone: build your Prompt OS']]
];
const chapters=levels.flatMap((l,li)=>l[1].map((name,ci)=>({id:li*6+ci+1,level:l[0],name,desc:`Master ${name.toLowerCase()} with guided examples, practice tasks, and prompt patterns.`})));
const assignmentBank=[
['ART Formula','In ART, what does A represent?',['Act','Answer','Analyze','Automate'],0],['Tokens','Which statement best describes a token?',['A full paragraph only','A unit of text processed by a model','A GPU core','A password'],1],['Few-shot','Few-shot prompting primarily gives the model…',['Examples of the desired behavior','A new API key','More storage','A browser'],0],['Structured output','Which format is ideal for machine-readable responses?',['Poem','JSON','Freeform essay','Screenshot'],1],['Evaluation','A prompt test set is used to…',['Compare prompt behavior consistently','Increase screen brightness','Store photos','Change fonts'],0]
];
function modelOptions(){ $('#modelSelect').innerHTML=models.map(m=>`<option value="${m.id}" ${m.id===state.selectedModel?'selected':''}>${m.name}</option>`).join(''); }
function profile(){ $('#pname').textContent=state.name||'Guest Learner'; if(state.picture) $('#avatar').src=state.picture; $('#loginTop').textContent=state.driveToken?'Sign out':'Sign in'; }
function home(){return `<section class="welcome"><div><h1>Hi ${esc(state.name||'Learner')},<br>What are we learning today?</h1><p>Prompt deliberately. Practice actively. Build real AI fluency.</p></div></section><div class="dashboard"><div class="panel"><div class="panel-head"><span class="panel-title">Learning Console</span><span class="chip">${state.mode} Mode</span></div><div class="panel-body"><div class="mode-card"><h3>AI Prompt Engineering Lab</h3><p class="muted">Use the composer below to study, practice, solve assignments, or attempt a problem without assistant help.</p><div class="chips"><button class="chip" onclick="setMode('Study')">Study</button><button class="chip" onclick="setMode('Assignment')">Assignment</button><button class="chip" onclick="setMode('Tasks')">Tasks</button><button class="chip" onclick="setMode('Problems')">Problems</button></div></div><div style="height:14px"></div><div class="stats"><div class="stat"><b>${state.progress.chapters}/60</b><span>Chapters</span></div><div class="stat"><b>${state.progress.problems}</b><span>Problems solved</span></div><div class="stat"><b>${state.progress.assignments}</b><span>Assignments</span></div></div><div style="height:14px"></div><div id="chatArea" class="chat">${state.history.slice(-20).map(bubble).join('')||'<div class="empty">Ask anything about prompt engineering…</div>'}</div></div></div><div class="panel"><div class="panel-head"><span class="panel-title">Token Analytics</span><span class="small">selected: ${selectedModelName()}</span></div><div class="panel-body"><div class="stat"><b>${state.tokens.total.toLocaleString()}</b><span>Tracked tokens this browser</span></div><p class="muted">Compare actual NVIDIA usage metadata when available.</p><div class="card"><h4>Same prompt · model comparison</h4>${state.lastComparison?comparisonCard():'<p class="muted">Make an NVIDIA API call to see live usage and transparent estimates for ChatGPT and Claude.</p>'}</div></div></div></div>`}
function lessons(){return `<div class="content"><div class="section-title">60 Chapters · 10 Levels</div><div class="grid">${chapters.map(c=>`<article class="card lesson"><div class="small">${c.level} · Chapter ${c.id}</div><h4>${esc(c.name)}</h4><p>${esc(c.desc)}</p><div class="row"><button class="goldbtn" onclick="viewChapter(${c.id})">View Chapter</button><button class="primary" onclick="downloadChapter(${c.id})">Download PDF</button></div></article>`).join('')}</div></div>`}
function learning(){let t=state.learningTab;return `<div class="content"><div class="section-title">Learning Mode</div><div class="panel" style="margin-bottom:14px"><div class="panel-body"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:7px"><b style="font-family:Playfair Display;color:var(--gold)">Chapter Progress</b><span class="small">${Math.min(state.progress.chapters,60)}/60</span></div><div class="progress"><i style="width:${Math.min(100,(state.progress.chapters/60)*100)}%"></i></div><p class="muted" style="margin:8px 0 0">Chapter ${Math.min(Math.max(state.progress.chapters,1),60)} of 60 — ${esc(chapters[Math.min(Math.max(state.progress.chapters,1),60)-1]?.level||levels[0][0])}</p></div></div><div class="tabs"><button class="tab ${t==='pdf'?'active':''}" onclick="learnTab('pdf')">PDF Viewer</button><button class="tab ${t==='examples'?'active':''}" onclick="learnTab('examples')">Examples with Solution</button><button class="tab ${t==='assistant'?'active':''}" onclick="learnTab('assistant')">AI Assistant Chat</button></div>${t==='pdf'?`<div class="panel"><div class="panel-body"><h3 style="font-family:Playfair Display;color:var(--gold)">FrameX Learning Reader</h3><p class="muted">Select a chapter in Lessons to download its study sheet. The viewer here keeps your current learning flow in one place.</p><div class="card"><h4>Current chapter</h4><p>${esc(chapters[Math.min(state.progress.chapters,59)].name)}</p><button class="goldbtn" onclick="downloadChapter(${Math.min(state.progress.chapters+1,60)})">Open / Download chapter sheet</button></div></div></div>`:t==='examples'?examples():assistantChat()}</div>`}
function examples(){return `<div class="grid"><div class="card lesson"><h4>Weak prompt</h4><p>“Explain prompting.”</p><h4>Improved prompt</h4><p>“Act as a senior prompt engineer. Explain zero-shot prompting to a first-year student in 5 bullet points, then give 2 examples and a 3-question quiz.”</p></div><div class="card lesson"><h4>ART Formula</h4><p><b>A — Act:</b> define the role or behavior.<br><b>R — Request:</b> state the desired outcome.<br><b>T — Tasks:</b> list concrete steps and constraints.</p></div><div class="card lesson"><h4>Verification</h4><p>Ask the model to list assumptions, identify uncertainty, and verify important claims before presenting the final answer.</p></div></div>`}
function assistantChat(){return `<div class="panel"><div class="panel-body"><div id="learnChat" class="chat">${state.history.filter(x=>x.mode==='Learning').slice(-12).map(bubble).join('')||'<div class="empty">Learning assistant ready. Ask about any prompt-engineering concept.</div>'}</div></div></div>`}
function assignments(){let t=state.assignTab;return `<div class="content"><div class="section-title">Assignments</div><div class="tabs"><button class="tab ${t==='notes'?'active':''}" onclick="assignTab('notes')">Lesson notes / short notes</button><button class="tab ${t==='solved'?'active':''}" onclick="assignTab('solved')">Solved record</button><button class="tab ${t==='upcoming'?'active':''}" onclick="assignTab('upcoming')">Upcoming preview</button></div>${t==='notes'?`<div class="grid">${levels.slice(0,5).map(x=>`<div class="card lesson"><h4>${x[0]}</h4><p>${x[1].slice(0,3).join(' · ')}.</p></div>`).join('')}</div>`:t==='solved'?`<div class="list">${state.marks.map(m=>`<div class="listrow"><div><b>${esc(m.title)}</b><div class="small">${m.date}</div></div><strong style="color:var(--rgold)">${m.score}/${m.total}</strong></div>`).join('')||'<div class="empty">No assignment record yet.</div>'}</div>`:`<div class="grid">${assignmentBank.map((q,i)=>`<div class="card"><div class="small">Preview ${i+1}</div><h4>${esc(q[0])}</h4><p>${esc(q[1])}</p><button class="primary" onclick="startAssignment(${i})">Start</button></div>`).join('')}</div>`}</div>`}
function problems(){let t=state.problemTab;return `<div class="content"><div class="section-title">Problem Statement Mode</div><div class="tabs"><button class="tab ${t==='lessons'?'active':''}" onclick="problemTab('lessons')">Lessons</button><button class="tab ${t==='solved'?'active':''}" onclick="problemTab('solved')">Problems Solved</button><button class="tab ${t==='new'?'active':''}" onclick="problemTab('new')">New</button></div>${t==='lessons'?`<div class="grid"><div class="card problem"><h4>How it works</h4><p>Read the statement, write a prompt that solves it, and submit your prompt. The assistant does not reveal a solution while you are in Problem mode.</p></div><div class="card problem"><h4>What is evaluated</h4><p>Instruction clarity, constraints, output control, verification, and ability to generalize the prompt.</p></div></div>`:t==='solved'?`<div class="list">${state.solved.map(s=>`<div class="listrow"><div><b>${esc(s.title)}</b><div class="small">${s.date}</div></div><span style="color:var(--rgold)">Solved</span></div>`).join('')||'<div class="empty">No solved problems yet.</div>'}</div>`:`<div class="panel"><div class="panel-body"><div class="card problem"><h4>New AI-generated problem</h4><p>Generate a fresh prompt-engineering problem. Your next message will be treated as your solution attempt; the assistant will not give the answer while Problems mode is active.</p><button class="goldbtn" onclick="generateProblem()">Generate problem</button><div id="problemOut" style="margin-top:12px"></div></div></div></div>`}</div>`}
function achievement(){let done=state.progress.problems>=10;return `<div class="content"><div class="section-title">Achievement</div><div class="grid"><div class="card"><h4>Problem batch</h4><p>${state.progress.problems} problems solved. Complete 10 to unlock the first batch badge.</p><div class="progress"><i style="width:${Math.min(100,state.progress.problems*10)}%"></i></div><div style="margin-top:12px;color:${done?'var(--rgold)':'var(--muted)'}">${done?'★ Batch completed':'Keep solving'}</div></div><div class="card"><h4>Assignment scores</h4><p>${state.marks.length} recorded assignments.</p><strong style="color:var(--gold);font-size:24px">${state.marks.length?Math.round(state.marks.reduce((a,b)=>a+b.score,0)/state.marks.length):0}%</strong></div><div class="certificate"><div class="small">FRAME X LEARNING</div><h2>Certificate of Prompt Mastery</h2><p>${done?'Unlocked after completing the problem batch.':'Complete the first problem batch to unlock this certificate.'}</p><button class="goldbtn" onclick="downloadCertificate()">${done?'Generate Certificate':'Preview Certificate'}</button></div></div></div>`}
function library(){return `<div class="content"><div class="section-title">Personal Prompt Library</div><input id="libSearch" class="search field" placeholder="Search saved prompts…" oninput="renderLibrary(this.value)"><div id="libList"></div><div class="card" style="margin-top:14px"><h4>Save the current prompt</h4><p class="muted">Paste or type a prompt below and save it to your personal collection.</p><textarea id="savePromptText" style="width:100%;min-height:120px;background:#050e17;color:#fff;border:1px solid rgba(255,215,0,.18);border-radius:12px;padding:12px"></textarea><div class="row" style="margin-top:10px"><button class="goldbtn" onclick="savePrompt()">Save prompt</button></div></div></div>`}
function renderLibrary(q=''){const el=$('#libList');if(!el)return;const arr=state.library.filter(x=>(x.text+' '+x.title).toLowerCase().includes((q||'').toLowerCase()));el.innerHTML=arr.map(x=>`<div class="listrow"><div><b>${esc(x.title)}</b><div class="small">${esc(x.text.slice(0,180))}</div></div><button class="goldbtn" onclick="copyPrompt(${state.library.indexOf(x)})">Copy</button></div>`).join('')||'<div class="empty">Your prompt library is empty.</div>'}
function render(section=state.section){state.section=section;save();$('#main').innerHTML={home,lessons,learning,assignments,problems,achievement,library}[section]();$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.section===section));if(section==='library')renderLibrary();}
function bubble(x){const msg=`<div class="bubble ${x.role==='user'?'user':'ai'} ${x.mode==='Tasks'?'mode-task':''}">${esc(x.text)}</div>`;if(x.role==='model'&&x.tokens){const pct=Math.min(100,(Number(x.tokens)/1800)*100);return msg+`<div class="tokenusage"><span>⚡ ${Number(x.tokens).toLocaleString()} tokens · ${esc(x.model||'Llama 3.3 70B')}</span><span class="tbar"><i style="width:${pct}%"></i></span></div>`}return msg} 
function comparisonCard(){const c=state.lastComparison;return `<table class="comparetable"><tr><th>Model</th><th>Tokens</th></tr><tr><td>Llama 3.2 90B <span class="small">(actual)</span></td><td>${Number(c.nvidia).toLocaleString()}</td></tr><tr><td>ChatGPT <span class="small">(est.)</span></td><td>${Number(c.chatgpt).toLocaleString()}</td></tr><tr><td>Claude <span class="small">(est.)</span></td><td>${Number(c.claude).toLocaleString()}</td></tr></table>`}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function selectedModelName(){return models.find(x=>x.id===state.selectedModel)?.name||state.selectedModel}
function setMode(m){state.mode=m;save();toast(m+' mode selected');render(state.section)}
function learnTab(t){state.learningTab=t;save();render('learning')} function assignTab(t){state.assignTab=t;save();render('assignments')} function problemTab(t){state.problemTab=t;save();render('problems')}
function downloadBlob(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function pdfEscape(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function simplePDF(title,lines){let y=760,stream='BT /F1 20 Tf 50 '+y+' Td ('+pdfEscape(title)+') Tj ET\n';y-=36;for(const line of lines){const chunks=line.match(/.{1,85}/g)||[''];for(const ch of chunks){stream+='BT /F1 11 Tf 50 '+y+' Td ('+pdfEscape(ch)+') Tj ET\n';y-=17;if(y<50){stream+='BT /F1 11 Tf 50 760 Td (Continue on next page.) Tj ET\n';y=730}}}const objs=[];objs[1]='<< /Type /Catalog /Pages 2 0 R >>';objs[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';objs[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>';objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';objs[5]='<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream';let out='%PDF-1.4\n',offs=[0];for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}const x=out.length;out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';downloadBlob(title.replace(/[^a-z0-9]+/gi,'-')+'.pdf',out,'application/pdf')}
function markChapterViewed(id){if(!state.viewedChapters.includes(id)){state.viewedChapters.push(id);state.progress.chapters=Math.min(60,state.viewedChapters.length);save();scheduleSync();render(state.section)}}
function viewChapter(id){const c=chapters.find(x=>x.id===id);if(!c)return;markChapterViewed(id);openPdfModal(c)}
function openPdfModal(c){openModal('Chapter '+String(c.id).padStart(2,'0')+' — '+c.name,`<div class="pdfbody"><iframe title="FrameX L Chapter PDF" src="./chapters/chapter-${String(c.id).padStart(2,'0')}.pdf"></iframe></div>`);$('#modal').querySelector('.modal').classList.add('pdfmodal')}
function downloadChapter(id){const c=chapters.find(x=>x.id===id);if(!c)return;markChapterViewed(id);simplePDF('FrameX L — Chapter '+id+': '+c.name,[c.level,'',c.desc,'','Learning objectives:','• Define the concept in your own words.','• Build one strong prompt using the concept.','• Test the prompt against a small example.','• Reflect on what changed and why.','','Practice prompt:','Act as a senior prompt engineer. Teach me '+c.name.toLowerCase()+' using the ART formula, then give me a short exercise and a verification checklist.']);toast('Chapter PDF generated')}
function downloadCertificate(){simplePDF('FrameX L — Certificate of Prompt Mastery',['This certificate recognizes a completed FrameX Learning problem batch.','','Learner: '+state.name,'Problems solved: '+state.progress.problems,'','Build with clarity. Verify with discipline. Prompt with purpose.']);toast('Certificate generated')}
function savePrompt(){const text=$('#savePromptText')?.value.trim();if(!text)return toast('Enter a prompt first');state.library.unshift({title:'Prompt '+(state.library.length+1),text,date:new Date().toLocaleString()});save();scheduleSync();$('#savePromptText').value='';renderLibrary();toast('Prompt saved locally')}
function copyPrompt(i){const x=state.library[i];navigator.clipboard?.writeText(x.text);toast('Prompt copied')}
function startAssignment(i){const q=assignmentBank[i];const ans=prompt(q[1]+'\n\n1. '+q[2][0]+'\n2. '+q[2][1]+'\n3. '+q[2][2]+'\n4. '+q[2][3]+'\n\nType the option number:');if(!ans)return;const correct=Number(ans)-1===q[3];const score=correct?100:0;state.marks.unshift({title:q[0],score,total:100,date:new Date().toLocaleDateString()});state.progress.assignments++;save();scheduleSync();toast(correct?'Correct — 100/100':'Recorded — review the lesson and try again');render('assignments')}
let currentProblem='';
async function generateProblem(){const out=$('#problemOut');out.innerHTML='<div class="loading"><i></i><i></i><i></i></div>';if(!state.nvKey){currentProblem='Design a prompt that converts a messy paragraph into a structured study table with exactly five columns, preserving every factual detail.';out.innerHTML='<p>'+esc(currentProblem)+'</p><span class="small">Local challenge shown because NVIDIA API key is not configured.</span>';return}try{const r=await nvidia('Generate one difficult but solvable prompt-engineering problem statement for a first-year learner. Do not provide a solution. Return only the problem statement.',false);currentProblem=r.text;out.innerHTML='<p>'+esc(r.text)+'</p><span class="small">Now submit your solving prompt in the bottom composer. The assistant will not solve it for you.</span>'}catch(e){out.innerHTML='<p>'+esc(e.message)+'</p>'}}
async function nvidia(userText,track=true){
  const key=String(state.nvKey||'').trim();
  if(!key)throw new Error('Add an NVIDIA API key in Settings to use AI.');
  if(!/^nvapi-[A-Za-z0-9_-]+$/.test(key))throw new Error('Invalid NVIDIA API key format. It should start with nvapi-.');
  const endpoint='https://integrate.api.nvidia.com/v1/chat/completions';
  let res;
  try{
    res=await fetch(endpoint,{
      method:'POST',
      mode:'cors',
      headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        model:'meta/llama-3.3-70b-instruct',
        messages:[{role:'user',content:userText}],
        max_tokens:1800,
        temperature:0.55,
        stream:false
      })
    });
  }catch(e){
    throw new Error('Could not reach NVIDIA API. Check your internet connection, API access, and browser network blocking. Details: '+(e?.message||'network error'));
  }
  const raw=await res.text();
  let data={};
  try{data=raw?JSON.parse(raw):{};}catch(_){}
  if(!res.ok){
    const detail=data?.error?.message||data?.message||raw||('HTTP '+res.status);
    throw new Error('NVIDIA API '+res.status+': '+detail);
  }
  const text=data?.choices?.[0]?.message?.content||'No response returned by NVIDIA.';
  const usage=data?.usage||{};
  const tok=Number(usage.total_tokens)||0;
  if(track){
    state.tokens.total+=tok;
    state.lastComparison={nvidia:tok,chatgpt:Math.round(tok*1.2),claude:Math.round(tok*1.4),updatedAt:Date.now()};
    scheduleSync();
  }
  return{text,usage,tok};
}
function renderChat(){const chatEl=$('#chatArea');if(!chatEl)return;chatEl.innerHTML=state.history.slice(-20).map(bubble).join('');chatEl.scrollTop=chatEl.scrollHeight;}
async function send(){const input=$('#input');const text=input.value.trim();if(!text)return;input.value='';state.history.push({role:'user',text,mode:state.mode,date:Date.now()});if(state.mode==='Problems'){state.progress.problems++;state.solved.unshift({title:currentProblem?.slice(0,80)||'Prompt challenge',date:new Date().toLocaleDateString()});state.history.push({role:'model',text:'Problem mode recorded your solving attempt. Review clarity, constraints, output format, and verification. The solution is intentionally withheld in this mode.',mode:state.mode,date:Date.now()});save();toast('Problem attempt recorded');renderChat();return}state.history.push({role:'model',text:'Thinking…',mode:state.mode,date:Date.now()});save();renderChat();try{const r=await nvidia(text);state.history[state.history.length-1].text=r.text;state.history[state.history.length-1].tokens=r.tok;state.history[state.history.length-1].model='Llama 3.3 70B';save();renderChat();scheduleSync()}catch(e){state.history[state.history.length-1].text='AI error: '+e.message;save();renderChat()}}
let syncTimer=null,syncBusy=false;
function setSync(v){const el=$('#syncStatus');if(el)el.classList.toggle('show',!!v)}
function scheduleSync(){clearTimeout(syncTimer);if(!state.driveToken)return;syncTimer=setTimeout(()=>syncDrive(false),30000)}
async function autoRestore(){if(!state.driveToken)return;try{setSync(true);const folder=await ensureFolder();const q=encodeURIComponent(`name='framex-learning-state.json' and '${folder}' in parents and trashed=false`);const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&pageSize=1',{headers:{Authorization:'Bearer '+state.driveToken}});const d=await r.json();if(d.files?.[0]){const fr=await fetch('https://www.googleapis.com/drive/v3/files/'+d.files[0].id+'?alt=media',{headers:{Authorization:'Bearer '+state.driveToken}});const remote=await fr.json();Object.assign(state,remote);state.driveToken=state.driveToken;state.driveFolderId=folder;state.viewedChapters=Array.isArray(state.viewedChapters)?state.viewedChapters:[];state.progress=state.progress||{chapters:state.viewedChapters.length,problems:0,assignments:0};save();modelOptions();profile();render(state.section);toast('FrameX L restored from Google Drive')}else{await syncDrive(false);toast('FrameX L folder ready — new state created')}}catch(e){toast('Drive restore failed: '+e.message)}finally{setSync(false)}}
async function syncDrive(show=true){if(!state.driveToken){if(show)toast('Sign in with Google first');return}if(syncBusy)return;syncBusy=true;setSync(true);try{const folder=await ensureFolder();const payload={version:2,updatedAt:new Date().toISOString(),name:state.name,email:state.email,picture:state.picture,progress:state.progress,tokens:state.tokens,library:state.library,history:state.history.slice(-100),solved:state.solved,marks:state.marks,achievements:state.achievements,viewedChapters:state.viewedChapters,nvKey:state.nvKey,selectedModel:state.selectedModel,lastComparison:state.lastComparison};await upsertDrive('framex-learning-state.json',JSON.stringify(payload,null,2),'application/json',folder);if(show)toast('FrameX L synced to Google Drive')}catch(e){toast('Drive sync failed: '+e.message)}finally{syncBusy=false;setSync(false)}}
async function ensureFolder(){if(state.driveFolderId)return state.driveFolderId;const q=encodeURIComponent("name='FrameX L' and mimeType='application/vnd.google-apps.folder' and trashed=false");const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)',{headers:{Authorization:'Bearer '+state.driveToken}});const d=await r.json();if(d.files?.[0]){state.driveFolderId=d.files[0].id;save();return state.driveFolderId}const c=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+state.driveToken,'Content-Type':'application/json'},body:JSON.stringify({name:'FrameX L',mimeType:'application/vnd.google-apps.folder'})});const x=await c.json();if(!c.ok)throw new Error(x.error?.message||'Cannot create Drive folder');state.driveFolderId=x.id;save();return x.id}
async function upsertDrive(name,text,mime,parent){const q=encodeURIComponent(`name='${name}' and '${parent}' in parents and trashed=false`);const r=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)',{headers:{Authorization:'Bearer '+state.driveToken}});const d=await r.json();const meta={name,mimeType:mime,parents:[parent]};const form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',new Blob([text],{type:mime}),name);const url=d.files?.[0]?'https://www.googleapis.com/upload/drive/v3/files/'+d.files[0].id+'?uploadType=multipart':'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';const method=d.files?.[0]?'PATCH':'POST';const u=await fetch(url,{method,headers:{Authorization:'Bearer '+state.driveToken},body:form});const x=await u.json();if(!u.ok)throw new Error(x.error?.message||'Drive write failed');return x}

function closeModal(){const m=$('#modal');if(!m)return;m.classList.remove('open');const box=m.querySelector('.modal');if(box)box.classList.remove('pdfmodal');$('#modalBody').innerHTML=''}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
function openSettings(){openModal('FrameX L Settings',`<div class="field"><label>NVIDIA API key</label><input id="nvKey" type="password" value="${esc(state.nvKey)}" placeholder="Paste your NVIDIA API key (nvapi-...)"></div><p class="muted">Your NVIDIA key powers the AI chat. It is stored in your browser and synced to your Google Drive folder when you sign in. Never publish the key inside this HTML file.</p><div class="row"><button class="primary" onclick="saveSettings()">Save settings</button><button class="goldbtn" onclick="syncDrive()">Sync to Drive</button></div>`)}
function saveSettings(){state.nvKey=$('#nvKey').value.trim();save();closeModal();toast('Settings saved')}

const GOOGLE_CLIENT_ID='236073548320-hsm1qb75ntanr5itj53m2j39i0h6okqf.apps.googleusercontent.com';

function initGoogle(){if(!window.google?.accounts?.oauth2)return;tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',callback:async(resp)=>{if(resp.error){toast(resp.error);return}state.driveToken=resp.access_token;try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+state.driveToken}});const u=await r.json();state.name=u.name||state.name;state.email=u.email||'';state.picture=u.picture||state.picture;save();profile();await autoRestore()}catch(e){toast('Google profile/Drive setup failed: '+e.message)}}});}

$('#hamb').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('open')};$('#closeSide').onclick=()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open')};$('#scrim').onclick=()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open')};$$('.navbtn').forEach(b=>b.onclick=()=>{render(b.dataset.section);$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open')});$('#send').onclick=send;$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#settings').onclick=openSettings;$('#modalClose').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#loginTop').onclick=signInGoogle;window.addEventListener('load',()=>setTimeout(initGoogle,300));$('#modelSelect').onchange=e=>{state.selectedModel=e.target.value;save();toast('Model switched to '+selectedModelName())};
window.setMode=setMode;window.learnTab=learnTab;window.assignTab=assignTab;window.problemTab=problemTab;window.downloadChapter=downloadChapter;window.viewChapter=viewChapter;window.downloadCertificate=downloadCertificate;window.savePrompt=savePrompt;window.copyPrompt=copyPrompt;window.startAssignment=startAssignment;window.generateProblem=generateProblem;window.renderLibrary=renderLibrary;window.syncDrive=syncDrive;window.saveSettings=saveSettings;window.connectGoogle=connectGoogle;window.openModal=openModal;window.closeModal=closeModal;
